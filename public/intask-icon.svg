<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="greenGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3DCB6C"/>
      <stop offset="100%" stop-color="#1A7A42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3DCB6C" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="16" fill="url(#greenGradient)" filter="url(#shadow)"/>
  
  <!-- Inner highlight circle -->
  <circle cx="32" cy="32" r="22" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Dynamic checkmark -->
  <path 
    d="M22 34 L29 41 L44 24" 
    stroke="white" 
    stroke-width="5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    fill="none"
  />
  
  <!-- Skill sparkle dots -->
  <circle cx="50" cy="14" r="3.5" fill="white" opacity="0.7"/>
  <circle cx="55" cy="22" r="2" fill="white" opacity="0.5"/>
</svg>