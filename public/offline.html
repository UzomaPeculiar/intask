<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#3dcb6c" />
  <title>You're offline — InTask</title>
  <style>
    :root {
      --bg: #eff8ea;
      --card: #ffffff;
      --text: #1a1e16;
      --muted: #6a8064;
      --primary: #3dcb6c;
      --primary-dark: #35b860;
      --border: #c4deb8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(61, 203, 108, 0.08);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: block;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--muted);
      margin: 0 0 24px;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--primary-dark); }
    button:active { transform: scale(0.99); }
  </style>
</head>
<body>
  <div class="card" role="alert">
    <svg class="logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#3DCB6C" />
          <stop offset="100%" stop-color="#1A7A42" />
        </linearGradient>
      </defs>
      <rect width="64" height="64" rx="16" fill="url(#g)" />
      <circle cx="32" cy="32" r="22" fill="rgba(255,255,255,0.1)" />
      <path d="M22 34 L29 41 L44 24" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </svg>
    <h1>You're offline</h1>
    <p>
      Your connection dropped and we can't reach the InTask servers right now.
      Once you're back online, refresh to continue where you left off.
    </p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
