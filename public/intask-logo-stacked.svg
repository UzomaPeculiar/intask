<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none">
  <defs>
    <linearGradient id="greenGradient" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3DCB6C"/>
      <stop offset="100%" stop-color="#1A7A42"/>
    </linearGradient>
  </defs>
  
  <!-- Logomark - larger for stacked layout -->
  <g transform="translate(30, 0)">
    <rect width="60" height="60" rx="15" fill="url(#greenGradient)"/>
    <circle cx="30" cy="30" r="20" fill="rgba(255,255,255,0.1)"/>
    <path d="M21 31 L27 37 L40 22" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="46" cy="11" r="3" fill="white" opacity="0.7"/>
    <circle cx="50" cy="18" r="1.8" fill="white" opacity="0.5"/>
  </g>
  
  <!-- Centered wordmark -->
  <text 
    x="60" 
    y="90" 
    font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" 
    font-size="32" 
    font-weight="700" 
    fill="#1A1E16"
    text-anchor="middle"
    letter-spacing="-0.5"
  >In</text>
  <text 
    x="60" 
    y="90" 
    font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" 
    font-size="32" 
    font-weight="700" 
    fill="#3DCB6C"
    text-anchor="start"
    letter-spacing="-0.5"
    dx="15"
  >Task</text>
  
  <!-- Tagline -->
  <text 
    x="60" 
    y="118" 
    font-family="'Inter', system-ui, sans-serif" 
    font-size="11" 
    font-weight="500" 
    fill="#6A8064"
    text-anchor="middle"
    letter-spacing="0.5"
  >Get paid for your skills</text>
</svg>