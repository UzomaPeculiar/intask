[build]
  command = "npm run build"
  publish = "dist/client"

[functions]
  directory = "dist/server"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

# PWA: never cache the service worker or manifest so updates propagate
# immediately; the SW handles its own cache versioning from there.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/javascript"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"